# Extra service used only by the Dev Container: a long-running shell with the same
# image, mounts and env as the other Node services. Run `pnpm dev` inside it.
services:
  devcontainer:
    extends:
      file: compose.yaml
      service: install
    command: sleep infinity
    environment:
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
