<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A subagent is a second window</title><desc id="desc">A main context window on the left holds the fixed cost, the conversation, and a three-sentence report. A sub-agent window on the right receives a short brief, reads twenty files and runs commands, and sends only the report back. A note says that everything the sub-agent read stays in its own window and is thrown away.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#429782"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:17px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:15px;fill:#172033} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .arrow-green {fill:none;stroke:#429782;stroke-width:2.5;marker-end:url(#arrow-green)} .who {font-size:15px;font-weight:700;letter-spacing:1px}</style></defs>
<rect width="1200" height="720" fill="white"/>
<rect x="24" y="24" width="1152" height="672" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">A subagent is a second window</text>
<text x="600" y="114" class="body" text-anchor="middle">The brief goes in. The report comes out. Everything in between stays there.</text>

<!-- main window -->
<rect x="64" y="160" width="440" height="440" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="84" y="196" class="heading">Main window</text>
<text x="84" y="222" class="small">The session you are typing in</text>

<rect x="84" y="244" width="400" height="56" rx="8" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="100" y="268" class="label">Fixed cost</text><text x="100" y="290" class="small">AGENTS.md, tools, skill list. Paid every session.</text>

<rect x="84" y="312" width="400" height="120" rx="8" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="100" y="336" class="label">Conversation</text>
<text x="100" y="360" class="small">The ticket. The seams you agreed. The diff so far.</text>
<text x="100" y="382" class="small">Grows with every turn, and never shrinks</text>
<text x="100" y="404" class="small">until /clear.</text>

<rect x="84" y="444" width="400" height="56" rx="8" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="100" y="468" class="label">Report, three sentences</text><text x="100" y="490" class="small">The only thing the subagent adds here.</text>

<text x="84" y="540" class="small">Twenty files were read for this ticket.</text>
<text x="84" y="562" class="small">None of them are in this window.</text>

<!-- subagent window -->
<rect x="696" y="160" width="440" height="440" rx="12" fill="#ffffff" stroke="#c08a1d" stroke-width="2" stroke-dasharray="8 6"/>
<text x="716" y="196" class="heading">Subagent window</text>
<text x="716" y="222" class="small">Started by the main agent. Closed when it reports.</text>

<rect x="716" y="244" width="400" height="56" rx="8" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="732" y="268" class="label">Brief</text><text x="732" y="290" class="small">"Review this diff against the spec. Under 400 words."</text>

<rect x="716" y="312" width="400" height="188" rx="8" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="732" y="336" class="label">Work</text>
<g>
<rect x="732" y="350" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="800" y="350" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="868" y="350" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="936" y="350" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="1004" y="350" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/>
<rect x="732" y="380" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="800" y="380" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="868" y="380" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="936" y="380" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="1004" y="380" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/>
<rect x="732" y="410" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="800" y="410" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="868" y="410" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="936" y="410" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="1004" y="410" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/>
<rect x="732" y="440" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="800" y="440" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="868" y="440" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="936" y="440" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/><rect x="1004" y="440" width="60" height="22" rx="4" fill="#ffffff" stroke="#b6c0cc"/>
</g>
<text x="732" y="486" class="small">Twenty files, the test output, its own reasoning.</text>

<rect x="716" y="512" width="400" height="56" rx="8" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="732" y="536" class="label">Report, three sentences</text><text x="732" y="558" class="small">Written to fit the brief. Then the window closes.</text>

<!-- arrows -->
<path d="M504 272 H696" class="arrow"/>
<text x="600" y="262" class="small" text-anchor="middle">brief</text>
<path d="M716 540 C 640 540, 560 472, 504 472" class="arrow-green"/>
<text x="600" y="566" class="small" text-anchor="middle">report</text>

<!-- shared, not shared -->
<text x="64" y="640" class="who" fill="#64748b">SHARED</text><text x="150" y="640" class="small">The files, the git checkout, AGENTS.md, the skills, the guard hook.</text>
<text x="64" y="668" class="who" fill="#c08a1d">NOT SHARED</text><text x="190" y="668" class="small">The conversation. Neither window sees the other's steps.</text>
</svg>
