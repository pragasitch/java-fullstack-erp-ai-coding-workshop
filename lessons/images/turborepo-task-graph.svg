<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
<title id="title">A task graph, built from your dependencies</title><desc id="desc">Database generation precedes database build. API build waits for database and contracts builds. Web build waits only for contracts. Independent tasks can run in parallel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="810" fill="white"/>
<rect x="24" y="24" width="1152" height="762" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">A task graph, built from your dependencies</text><text x="600" y="114" class="body" text-anchor="middle">Package dependencies + turbo.json → a safe execution order</text>
<text x="80" y="174" class="heading" text-anchor="start">Dependencies finish before their consumers start.</text><rect x="80" y="220" width="250" height="84" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="205.0" y="257.0" class="label" text-anchor="middle">database</text><text x="205.0" y="286.0" class="body" text-anchor="middle">db:generate</text><rect x="430" y="220" width="250" height="84" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="555.0" y="257.0" class="label" text-anchor="middle">database</text><text x="555.0" y="286.0" class="body" text-anchor="middle">build</text><rect x="80" y="404" width="250" height="84" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="205.0" y="441.0" class="label" text-anchor="middle">contracts</text><text x="205.0" y="470.0" class="body" text-anchor="middle">build</text><rect x="860" y="312" width="250" height="84" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="985.0" y="349.0" class="label" text-anchor="middle">api</text><text x="985.0" y="378.0" class="body" text-anchor="middle">build</text><rect x="860" y="496" width="250" height="84" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="985.0" y="533.0" class="label" text-anchor="middle">web</text><text x="985.0" y="562.0" class="body" text-anchor="middle">build</text><path d="M330 262 H420" class="arrow"/><path d="M680 262 H760 V340 H850" class="arrow"/><path d="M330 446 H720 V370 H850" class="arrow"/><path d="M330 446 H680 V538 H850" class="arrow"/><text x="80" y="350" class="body" text-anchor="start">Generation runs first.</text><text x="80" y="530" class="body" text-anchor="start">Contracts can build while database work runs.</text><rect x="64" y="620" width="1072" height="154" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="90" y="658" class="heading" text-anchor="start">Read the graph, not a fixed sequence</text><text x="90" y="697" class="body" text-anchor="start">API waits for both shared packages. Web only waits for contracts.</text><text x="90" y="735" class="body" text-anchor="start">Independent tasks can overlap; arrows describe prerequisites, not duration.</text>
</svg>
