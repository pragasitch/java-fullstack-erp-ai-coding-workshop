<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Auto memory compared with a handoff file</title><desc id="desc">Two ways to carry context from one session to the next. Auto memory: the agent decides what to keep, the notes live in your home directory on one machine, nobody reviews them, and they load silently in every later session, even when stale. Handoff file: you ask for it at the end of a session, it is a markdown file in the repository, you read and edit it, and it is loaded only when you point the next session at it.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:18px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:18px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .dashed {fill:none;stroke:#c08a1d;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="720" fill="white"/>
<rect x="24" y="24" width="1152" height="672" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Carrying context to the next session</text>
<text x="600" y="114" class="body" text-anchor="middle">Both move knowledge forward. Only one of them can be read, reviewed and shared.</text>
<rect x="60" y="146" width="520" height="520" rx="12" fill="#ffffff" stroke="#c08a1d" stroke-width="2"/>
<text x="320" y="190" class="heading" text-anchor="middle">Auto memory</text><text x="320" y="218" class="small" text-anchor="middle">switched off in this repository</text>
<rect x="90" y="246" width="170" height="64" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="175" y="285" class="label" text-anchor="middle">Session 1</text>
<rect x="380" y="246" width="170" height="64" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="465" y="285" class="label" text-anchor="middle">Session 2</text>
<path d="M260 278 C300 340 340 340 376 282" class="dashed"/><text x="320" y="360" class="small" text-anchor="middle">hidden notes in ~/</text>
<text x="90" y="420" class="body">• The agent decides what to keep.</text>
<text x="90" y="462" class="body">• Stored on one machine, outside git.</text>
<text x="90" y="504" class="body">• Nobody reviews it.</text>
<text x="90" y="546" class="body">• Loads in every later session,</text><text x="110" y="574" class="body">even after it goes stale.</text>
<text x="90" y="616" class="body">• Your teammate never sees it.</text>
<rect x="620" y="146" width="520" height="520" rx="12" fill="#ffffff" stroke="#429782" stroke-width="2"/>
<text x="880" y="190" class="heading" text-anchor="middle">Handoff file</text><text x="880" y="218" class="small" text-anchor="middle">what we use instead</text>
<rect x="650" y="246" width="150" height="64" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="725" y="285" class="label" text-anchor="middle">Session 1</text>
<rect x="808" y="320" width="144" height="56" rx="10" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="880" y="354" class="code" text-anchor="middle">handoff.md</text>
<rect x="960" y="246" width="150" height="64" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="1035" y="285" class="label" text-anchor="middle">Session 2</text>
<path d="M725 310 V348 H802" class="arrow"/><path d="M952 348 H1035 V316" class="arrow"/>
<text x="650" y="420" class="body">• You ask for it when you stop.</text>
<text x="650" y="462" class="body">• A markdown file in the repository.</text>
<text x="650" y="504" class="body">• You read it and fix it.</text>
<text x="650" y="546" class="body">• Loads only when you point the</text><text x="670" y="574" class="body">next session at it.</text>
<text x="650" y="616" class="body">• Anyone can pick up the work.</text>
</svg>
