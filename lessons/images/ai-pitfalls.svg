<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Keep the agent’s scope manageable</title><desc id="desc">Three pitfalls and remedies: avoid context flooding by focusing on relevant packages and scoped commands; avoid generated-file noise by editing source files; avoid oversized changes by delivering and verifying thin slices.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="900" fill="white"/>
<rect x="24" y="24" width="1152" height="852" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Keep the agent’s scope manageable</text><text x="600" y="114" class="body" text-anchor="middle">Repository access is broad. Each piece of work should stay small.</text>
<rect x="64" y="156" width="1072" height="198" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="195" class="heading" text-anchor="start">1 · Too much context</text><rect x="88" y="220" width="420" height="62" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="298.0" y="258.0" class="label" text-anchor="middle">Read everything at once</text><path d="M508 251 H574" class="arrow"/><rect x="584" y="220" width="528" height="62" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="848.0" y="258.0" class="label" text-anchor="middle">Focus on relevant packages</text><text x="88" y="325" class="body" text-anchor="start">Keep instructions short; scope task runs.</text><rect x="64" y="378" width="1072" height="198" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="417" class="heading" text-anchor="start">2 · Generated-file noise</text><rect x="88" y="442" width="420" height="62" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="298.0" y="480.0" class="label" text-anchor="middle">Edit generated output</text><path d="M508 473 H574" class="arrow"/><rect x="584" y="442" width="528" height="62" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="848.0" y="480.0" class="label" text-anchor="middle">Change the source of truth</text><text x="88" y="547" class="body" text-anchor="start">Leave dist/, node_modules/ and generated clients alone.</text><rect x="64" y="600" width="1072" height="198" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="639" class="heading" text-anchor="start">3 · Oversized changes</text><rect x="88" y="664" width="420" height="62" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="298.0" y="702.0" class="label" text-anchor="middle">Change the whole feature</text><path d="M508 695 H574" class="arrow"/><rect x="584" y="664" width="528" height="62" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="848.0" y="702.0" class="label" text-anchor="middle">Deliver one thin slice</text><text x="88" y="769" class="body" text-anchor="start">Verify each increment before expanding it.</text><text x="600" y="850" class="heading" text-anchor="middle">A shared repository helps most when the agent’s task stays focused.</text>
</svg>
