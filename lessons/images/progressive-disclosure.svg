<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Progressive disclosure: always loaded versus on demand</title><desc id="desc">Left column, always loaded at the start of a session: the root AGENTS.md, the AGENTS.md of each app being edited, and one line of name and description per skill. Right column, loaded on demand: the full SKILL.md of add-feature, write-tests and repo-commands. Arrows show that the agent reads a skill body only when the task matches its description.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:18px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:19px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="760" fill="white"/>
<rect x="24" y="24" width="1152" height="712" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Progressive disclosure</text><text x="600" y="114" class="body" text-anchor="middle">Short rules are always present. Long recipes are read only when they are needed.</text>
<rect x="64" y="150" width="520" height="470" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="324" y="190" class="heading" text-anchor="middle">Always loaded</text><text x="324" y="218" class="small" text-anchor="middle">at the start of every session</text>
<rect x="88" y="240" width="472" height="62" rx="10" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="324" y="266" class="label" text-anchor="middle">AGENTS.md (root)</text><text x="324" y="291" class="small" text-anchor="middle">layout · contract-first · ESM · pnpm check · skill list</text>
<rect x="88" y="314" width="228" height="62" rx="10" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="202" y="340" class="label" text-anchor="middle">apps/api/AGENTS.md</text><text x="202" y="365" class="small" text-anchor="middle">when editing the api</text>
<rect x="332" y="314" width="228" height="62" rx="10" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="446" y="340" class="label" text-anchor="middle">apps/web/AGENTS.md</text><text x="446" y="365" class="small" text-anchor="middle">when editing the web app</text>
<text x="324" y="420" class="label" text-anchor="middle">Skill names and descriptions</text>
<rect x="88" y="436" width="472" height="46" rx="10" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="100" y="466" class="code">add-feature: feature recipe + templates</text>
<rect x="88" y="494" width="472" height="46" rx="10" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="100" y="524" class="code">write-tests: api, web and schema tests</text>
<rect x="88" y="552" width="472" height="46" rx="10" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="100" y="582" class="code">repo-commands: Docker, db, --filter</text>
<rect x="616" y="150" width="520" height="470" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
<text x="876" y="190" class="heading" text-anchor="middle">Loaded on demand</text><text x="876" y="218" class="small" text-anchor="middle">only when the task matches the description</text>
<rect x="640" y="436" width="472" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="652" y="466" class="code">.agents/skills/add-feature/SKILL.md</text>
<rect x="640" y="494" width="472" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="652" y="524" class="code">.agents/skills/write-tests/SKILL.md</text>
<rect x="640" y="552" width="472" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="652" y="582" class="code">.agents/skills/repo-commands/SKILL.md</text>
<path d="M560 459 H630" class="arrow"/><path d="M560 517 H630" class="arrow"/><path d="M560 575 H630" class="arrow"/>
<rect x="640" y="250" width="472" height="150" rx="10" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="876" y="290" class="label" text-anchor="middle">"Add a customers endpoint"</text><text x="876" y="322" class="body" text-anchor="middle">matches add-feature → the agent reads</text><text x="876" y="350" class="body" text-anchor="middle">that one file. The test recipe and the</text><text x="876" y="378" class="body" text-anchor="middle">command cheat-sheet stay out of the window.</text>
<rect x="64" y="644" width="1072" height="70" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="600" y="687" class="heading" text-anchor="middle">The agent pays for a rule every session, but for a recipe only when it uses it.</text>
</svg>
