<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Give the agent the whole picture</title><desc id="desc">One checkout contains the database model, shared contract, API handlers and UI. The agent can read each layer and update them together in one branch.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="790" fill="white"/>
<rect x="24" y="24" width="1152" height="742" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Give the agent the whole picture</text><text x="600" y="114" class="body" text-anchor="middle">Related source code lives within the same working context.</text>
<rect x="64" y="156" width="1072" height="382" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="90" y="198" class="heading" text-anchor="start">One checkout: the whole feature is visible</text><rect x="90" y="230" width="490" height="104" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="335.0" y="277.0" class="label" text-anchor="middle">Database</text><text x="335.0" y="306.0" class="body" text-anchor="middle">schema.prisma</text><rect x="620" y="230" width="490" height="104" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="865.0" y="277.0" class="label" text-anchor="middle">Contract</text><text x="865.0" y="306.0" class="body" text-anchor="middle">packages/contracts/src/</text><rect x="90" y="380" width="490" height="104" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="335.0" y="427.0" class="label" text-anchor="middle">API</text><text x="335.0" y="456.0" class="body" text-anchor="middle">apps/api/src/</text><rect x="620" y="380" width="490" height="104" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="865.0" y="427.0" class="label" text-anchor="middle">UI</text><text x="865.0" y="456.0" class="body" text-anchor="middle">apps/web/src/</text><path d="M580 282 H610" class="arrow"/><path d="M865 334 V356 H335 V370" class="arrow"/><path d="M580 432 H610" class="arrow"/><path d="M600 538 V586" class="arrow"/><rect x="260" y="596" width="680" height="90" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="600.0" y="636.0" class="label" text-anchor="middle">Agent reads the real feature</text><text x="600.0" y="665.0" class="body" text-anchor="middle">model + API shape + handler + screen</text><text x="600" y="738" class="heading" text-anchor="middle">One branch can update every layer together.</text>
</svg>
