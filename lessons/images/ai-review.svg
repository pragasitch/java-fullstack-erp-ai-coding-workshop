<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
<title id="title">An AI reviewer on every pull request</title><desc id="desc">Top to bottom in four rows. First, a trigger: a push to the pull request branch, or a manual dispatch with the PR number. Second, a GitHub Actions job that checks out the repository, installs Node and Kiro CLI, and runs kiro-cli headless with the reviewer agent and the API key from a repository secret. Third, the reviewer agent, an amber row, reads four things: the ticket, the diff against main, the pull request body and the CI status, under the same guard hook as every other agent, with read-only permissions. Its only write is one comment-state review on the pull request. A red strip in the row says: never approves, never requests changes, never merges, never closes. Fourth, the human: reads the review as a script, runs the demo line, reads the diff against the criteria, and merges by hand. A note across the bottom says: the review is advice; the verdict and the merge are a human's.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:17px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:15px;fill:#172033} .badge {font-size:16px;font-weight:700;fill:#ffffff} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .who {font-size:15px;font-weight:700;letter-spacing:1px} .no {font-size:16px;font-weight:700;fill:#b42318}</style></defs>
<rect width="1200" height="990" fill="white"/>
<rect x="24" y="24" width="1152" height="942" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">An AI reviewer on every pull request</text>
<text x="600" y="114" class="body" text-anchor="middle">The agent is the one amber row. It reads four things and writes one file. The job posts it; the verdict and the merge stay with you.</text>

<!-- 1 trigger -->
<rect x="60" y="150" width="1080" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<rect x="76" y="164" width="40" height="36" rx="8" fill="#64748b"/><text x="96" y="188" class="badge" text-anchor="middle">1</text>
<text x="128" y="189" class="label">Trigger</text>
<text x="76" y="224" class="small">A push to the PR branch, or a manual run with the PR number.</text>
<text x="76" y="246" class="small">Either way the job gets one thing: the PR number to review.</text>
<rect x="720" y="166" width="404" height="88" rx="8" fill="#f1f5f9" stroke="#dce3eb" stroke-width="1.5"/>
<text x="736" y="202" class="code">gh workflow run \</text>
<text x="736" y="226" class="code">  ai-review.yml -f pr=16</text>
<path d="M600 270 V302" class="arrow"/>

<!-- 2 actions job -->
<rect x="60" y="310" width="1080" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<rect x="76" y="324" width="40" height="36" rx="8" fill="#64748b"/><text x="96" y="348" class="badge" text-anchor="middle">2</text>
<text x="128" y="349" class="label">Actions job</text>
<text x="76" y="384" class="small">Checkout, Node, Kiro CLI. The API key comes from a repository secret.</text>
<text x="76" y="406" class="small">Posts the file as a comment-state review. Never fails the PR.</text>
<rect x="720" y="326" width="404" height="88" rx="8" fill="#f1f5f9" stroke="#dce3eb" stroke-width="1.5"/>
<text x="736" y="362" class="code">kiro-cli chat --v3 --no-interactive \</text>
<text x="736" y="386" class="code">  --agent reviewer</text>
<path d="M600 430 V462" class="arrow"/>

<!-- 3 reviewer agent -->
<rect x="60" y="470" width="1080" height="230" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<rect x="76" y="484" width="40" height="36" rx="8" fill="#c08a1d"/><text x="96" y="508" class="badge" text-anchor="middle">3</text>
<text x="128" y="509" class="label">Reviewer agent</text>
<text x="76" y="544" class="who" fill="#c08a1d">READS</text>
<text x="76" y="570" class="small">The ticket and its criteria</text>
<text x="76" y="592" class="small">The diff against main</text>
<text x="76" y="614" class="small">The PR body: Evidence, Merge Danger</text>
<text x="76" y="636" class="small">CI status</text>
<text x="440" y="544" class="who" fill="#c08a1d">WRITES</text>
<text x="440" y="570" class="small">One file, .ai-review/review.md:</text>
<text x="440" y="592" class="small">verdict, criteria table, findings. It never posts.</text>
<text x="440" y="626" class="code">.ai-review/review.md</text>
<rect x="780" y="486" width="344" height="120" rx="8" fill="#fde8e6" stroke="#b42318" stroke-width="1.5"/>
<text x="952" y="514" class="no" text-anchor="middle">Never approves.</text>
<text x="952" y="538" class="no" text-anchor="middle">Never requests changes.</text>
<text x="952" y="562" class="no" text-anchor="middle">Never merges. Never closes.</text>
<text x="952" y="586" class="no" text-anchor="middle">Read-only on disk.</text>
<text x="76" y="676" class="small">Same guard hook as every agent in the repo, plus permission rules: allow-listed shell only.</text>
<path d="M600 700 V732" class="arrow"/>

<!-- 4 human -->
<rect x="60" y="740" width="1080" height="120" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<rect x="76" y="754" width="40" height="36" rx="8" fill="#429782"/><text x="96" y="778" class="badge" text-anchor="middle">4</text>
<text x="128" y="779" class="label">You</text>
<text x="76" y="814" class="small">Read the review as your script. Do the Demo line.</text>
<text x="76" y="836" class="small">Diff against the criteria. Tick the boxes. Merge, by hand, if it holds.</text>
<rect x="720" y="756" width="404" height="88" rx="8" fill="#ffffff" stroke="#429782" stroke-width="1.5"/>
<text x="736" y="792" class="code">gh pr merge 16</text>
<text x="736" y="816" class="small">Only a human runs this.</text>

<!-- legend -->
<rect x="60" y="890" width="1080" height="52" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/>
<text x="80" y="923" class="who" fill="#c08a1d">AGENT</text><text x="150" y="923" class="small">3, in a fresh window, with no memory of writing the code.</text>
<text x="590" y="923" class="who" fill="#64748b">YOU</text><text x="638" y="923" class="small">1 and 4. The review is advice. The verdict and merge are yours.</text>
</svg>
