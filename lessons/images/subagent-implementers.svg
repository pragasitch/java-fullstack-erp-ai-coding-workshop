<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">implement-spec: subagents that do the work</title><desc id="desc">Three lanes. Top: one orchestrator window reads the spec, sends an explorer subagent to leave notes outside the repo, creates an integration branch, dispatches the frontier tickets, and at the end runs code-review once, fixes, and cleans up. Middle: implementer subagents, one per frontier ticket, each in its own git worktree and branch, running in the background; a third one is blocked until ticket 16 is merged. Bottom: a merger subagent lands each finished ticket on the integration branch, main to integration to merge 16, merge 17, merge 18, review and fix, and then you review that one branch. Notes say this needs background subagents with a worktree each, which today means Claude Code, and that nobody does the demo-diff-boxes step, so seams must be in the tickets.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#429782"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:17px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:15px;fill:#172033} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .arrow-green {fill:none;stroke:#429782;stroke-width:2.5;marker-end:url(#arrow-green)} .who {font-size:15px;font-weight:700;letter-spacing:1px}</style></defs>
<rect width="1200" height="720" fill="white"/>
<rect x="24" y="24" width="1152" height="672" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">implement-spec: subagents that do the work</text>
<text x="600" y="114" class="body" text-anchor="middle">One orchestrator, one implementer per frontier ticket, each in its own worktree. You review one branch at the end.</text>

<!-- lane A: orchestrator -->
<rect x="64" y="140" width="1072" height="142" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="84" y="172" class="heading">Orchestrator window</text>
<text x="84" y="196" class="small">One session. Writes briefs, waits for reports, never edits code itself.</text>

<rect x="84" y="212" width="136" height="56" rx="8" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="100" y="236" class="label">1 Spec</text><text x="100" y="257" class="small">read all of it</text>
<path d="M220 240 H244" class="arrow"/>

<rect x="244" y="212" width="190" height="56" rx="8" fill="#fff4d6" stroke="#c08a1d" stroke-width="2" stroke-dasharray="6 4"/>
<text x="260" y="236" class="label">2 Explore</text><text x="260" y="257" class="small">notes outside repo</text>
<path d="M434 240 H458" class="arrow"/>

<rect x="458" y="212" width="170" height="56" rx="8" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="474" y="236" class="label">3 Branch</text><text x="474" y="257" class="small">integration, off main</text>
<path d="M628 240 H652" class="arrow"/>

<rect x="652" y="212" width="190" height="56" rx="8" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="668" y="236" class="label">4 Dispatch</text><text x="668" y="257" class="small">frontier tickets go out</text>
<path d="M842 240 H866" class="arrow"/>

<rect x="866" y="212" width="210" height="56" rx="8" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="882" y="236" class="label">7–8 Finish</text><text x="882" y="257" class="small">review once, fix, clean up</text>

<!-- lane B: implementers -->
<rect x="64" y="300" width="1072" height="170" rx="12" fill="#ffffff" stroke="#c08a1d" stroke-width="2" stroke-dasharray="8 6"/>
<text x="84" y="332" class="heading">5 Implementer subagents, in the background</text>

<rect x="84" y="350" width="330" height="102" rx="8" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="100" y="376" class="label">Ticket #16</text>
<text x="100" y="398" class="small">worktree wt-16, branch ticket-16</text>
<text x="100" y="418" class="small">brief: the ticket + the notes folder</text>
<text x="100" y="438" class="small">report: one commit, checks green</text>

<rect x="432" y="350" width="330" height="102" rx="8" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="448" y="376" class="label">Ticket #17</text>
<text x="448" y="398" class="small">worktree wt-17, branch ticket-17</text>
<text x="448" y="418" class="small">brief: the ticket + the notes folder</text>
<text x="448" y="438" class="small">report: one commit, checks green</text>

<rect x="780" y="350" width="336" height="102" rx="8" fill="#ffffff" stroke="#c08a1d" stroke-width="2" stroke-dasharray="6 4"/>
<text x="796" y="376" class="label">Ticket #18, blocked by #16</text>
<text x="796" y="398" class="small">starts the moment #16 is merged</text>
<text x="796" y="418" class="small">same brief shape, its own worktree</text>
<text x="796" y="438" class="small">two editing one checkout would collide</text>

<!-- lane C: integration branch -->
<rect x="64" y="488" width="1072" height="138" rx="12" fill="#ffffff" stroke="#429782" stroke-width="2"/>
<text x="84" y="516" class="heading">6 Merger subagent</text>
<text x="84" y="540" class="small">a merge can unblock more tickets</text>

<line x1="110" y1="576" x2="1090" y2="576" stroke="#429782" stroke-width="3"/>
<circle cx="110" cy="576" r="8" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
<circle cx="260" cy="576" r="8" fill="#ffffff" stroke="#429782" stroke-width="2.5"/>
<circle cx="420" cy="576" r="8" fill="#d9f2e9" stroke="#429782" stroke-width="2.5"/>
<circle cx="590" cy="576" r="8" fill="#d9f2e9" stroke="#429782" stroke-width="2.5"/>
<circle cx="760" cy="576" r="8" fill="#d9f2e9" stroke="#429782" stroke-width="2.5"/>
<circle cx="930" cy="576" r="8" fill="#d9f2e9" stroke="#429782" stroke-width="2.5"/>
<circle cx="1090" cy="576" r="8" fill="#429782" stroke="#429782" stroke-width="2.5"/>
<text x="110" y="606" class="small" text-anchor="middle">main</text>
<text x="260" y="606" class="small" text-anchor="middle">integration</text>
<text x="420" y="606" class="small" text-anchor="middle">merge #16</text>
<text x="590" y="606" class="small" text-anchor="middle">merge #17</text>
<text x="760" y="606" class="small" text-anchor="middle">merge #18</text>
<text x="930" y="606" class="small" text-anchor="middle">review + fix</text>
<text x="1090" y="606" class="small" text-anchor="middle">you review</text>

<!-- implementers to merges -->
<path d="M400 452 C 400 520, 420 520, 420 564" class="arrow-green"/>
<path d="M600 452 C 600 520, 590 520, 590 564" class="arrow-green"/>
<path d="M800 452 C 800 520, 760 520, 760 564" class="arrow-green"/>

<!-- notes -->
<text x="64" y="654" class="who" fill="#c08a1d">NEEDS</text><text x="140" y="654" class="small">Background runs and a worktree per subagent. Today that is Claude Code. Kiro shares one checkout; Codex waits for all.</text>
<text x="64" y="682" class="who" fill="#64748b">NO HUMAN</text><text x="170" y="682" class="small">Nobody does the demo-diff-boxes step, so the seams go in the tickets. Read this. Don't run it yet.</text>
</svg>
