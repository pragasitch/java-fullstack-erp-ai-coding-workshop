<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">From a Terms of Reference to tickets an agent can implement</title><desc id="desc">Three steps in order, each run by one skill. Grill: the grill-me skill interviews you about the TOR in rounds of questions until every open decision is settled; it writes nothing. Spec: the to-spec skill turns that conversation into a spec with user stories and implementation decisions and publishes it as one GitHub issue. Tickets: the to-tickets skill breaks the spec into vertical-slice tickets that each declare what blocks them, shows you the list to approve, then publishes them as sub-issues of the spec labelled ready-for-agent. A fourth greyed box, implement, belongs to the next lesson. All three steps run in one conversation without clearing.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:18px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:18px;fill:#172033} .badge {font-size:16px;font-weight:700;fill:#ffffff} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .muted {fill:#94a3b8}</style></defs>
<rect width="1200" height="700" fill="white"/>
<rect x="24" y="24" width="1152" height="652" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">From a Terms of Reference to tickets an agent can implement</text>
<text x="600" y="114" class="body" text-anchor="middle">Three skills, run in order, in one conversation. Each one's output is the next one's input.</text>

<rect x="60" y="150" width="200" height="64" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="160" y="178" class="label" text-anchor="middle">The TOR</text><text x="160" y="202" class="code" text-anchor="middle">docs/tors/*.md</text>
<path d="M260 182 H292" class="arrow"/>

<rect x="300" y="150" width="270" height="64" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<rect x="316" y="164" width="40" height="36" rx="8" fill="#c08a1d"/><text x="336" y="188" class="badge" text-anchor="middle">1</text>
<text x="452" y="178" class="label" text-anchor="middle">Grill</text><text x="452" y="202" class="code" text-anchor="middle">/grill-me</text>
<path d="M570 182 H602" class="arrow"/>

<rect x="610" y="150" width="270" height="64" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
<rect x="626" y="164" width="40" height="36" rx="8" fill="#64748b"/><text x="646" y="188" class="badge" text-anchor="middle">2</text>
<text x="762" y="178" class="label" text-anchor="middle">Spec</text><text x="762" y="202" class="code" text-anchor="middle">/to-spec</text>
<path d="M880 182 H912" class="arrow"/>

<rect x="920" y="150" width="220" height="64" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<rect x="936" y="164" width="40" height="36" rx="8" fill="#429782"/><text x="956" y="188" class="badge" text-anchor="middle">3</text>
<text x="1050" y="178" class="label" text-anchor="middle">Tickets</text><text x="1050" y="202" class="code" text-anchor="middle">/to-tickets #N</text>

<path d="M160 214 V250" class="arrow"/><path d="M452 214 V250" class="arrow"/><path d="M762 214 V250" class="arrow"/><path d="M1030 214 V250" class="arrow"/>

<rect x="60" y="260" width="200" height="236" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="76" y="292" class="label">For a contract</text>
<text x="76" y="324" class="small">Rules, roles, open</text><text x="76" y="348" class="small">questions, exclusions</text><text x="76" y="372" class="small">and acceptance</text><text x="76" y="396" class="small">scenarios.</text>
<text x="76" y="440" class="small">Not yet decisions an</text><text x="76" y="464" class="small">agent can build from.</text>

<rect x="300" y="260" width="270" height="236" rx="12" fill="#ffffff" stroke="#c08a1d" stroke-width="2"/>
<text x="316" y="292" class="label">An interview</text>
<text x="316" y="324" class="small">Rounds of questions, each</text><text x="316" y="348" class="small">with a recommended answer.</text>
<text x="316" y="380" class="small">Facts: the agent looks up.</text><text x="316" y="404" class="small">Decisions: you make.</text>
<text x="316" y="440" class="small">Writes nothing. Stops when</text><text x="316" y="464" class="small">no open decision remains.</text>

<rect x="610" y="260" width="270" height="236" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="626" y="292" class="label">One spec issue</text>
<text x="626" y="324" class="small">Problem, solution, user</text><text x="626" y="348" class="small">stories, implementation and</text><text x="626" y="372" class="small">testing decisions, and what</text><text x="626" y="396" class="small">is out of scope.</text>
<text x="626" y="440" class="small">No interview. It synthesises</text><text x="626" y="464" class="small">the grill conversation.</text>

<rect x="920" y="260" width="220" height="236" rx="12" fill="#ffffff" stroke="#429782" stroke-width="2"/>
<text x="936" y="292" class="label">15 to 25 sub-issues</text>
<text x="936" y="324" class="small">Vertical slices through</text><text x="936" y="348" class="small">schema, API, UI, tests,</text><text x="936" y="372" class="small">each demoable alone.</text><text x="936" y="396" class="small">Each says what blocks it.</text>
<text x="936" y="440" class="small">You approve the list</text><text x="936" y="464" class="small">before it is published.</text>

<rect x="60" y="530" width="1080" height="110" rx="12" fill="#eef2f7" stroke="#dce3eb" stroke-width="2"/>
<rect x="84" y="552" width="270" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
<text x="219" y="580" class="label muted" text-anchor="middle">Next lesson: implement</text><text x="219" y="604" class="code muted" text-anchor="middle">/implement #ticket</text>
<text x="380" y="572" class="small">Each ticket is sized for one fresh context window. An agent takes a ticket whose blockers</text>
<text x="380" y="598" class="small">are all closed, builds it, and the next one opens up. Nothing in this flow lives outside</text>
<text x="380" y="624" class="small">git or GitHub, so every laptop in the room starts from the same place.</text>
</svg>
