<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Where a hook sits</title><desc id="desc">Left to right: you type a prompt; the agent decides on a tool call such as a shell command; before the command runs, the harness pipes the call to the guard script as JSON. If the script exits 0 the command runs and its output goes back to the agent. If it exits 2 the command never runs and the script's stderr goes back to the agent as the reason, and the agent asks you. A note at the bottom says CI checks the result after the push, while the hook checks the action before it runs.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#429782"/></marker>
<marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b4443c"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:17px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:15px;fill:#172033} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .arrow-green {fill:none;stroke:#429782;stroke-width:2.5;marker-end:url(#arrow-green)} .arrow-red {fill:none;stroke:#b4443c;stroke-width:2.5;marker-end:url(#arrow-red)} .who {font-size:15px;font-weight:700;letter-spacing:1px}</style></defs>
<rect width="1200" height="640" fill="white"/>
<rect x="24" y="24" width="1152" height="592" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Where a hook sits</text>
<text x="600" y="114" class="body" text-anchor="middle">Between the agent deciding to run a command and the command running</text>

<!-- you -->
<rect x="64" y="200" width="200" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="164" y="240" class="label" text-anchor="middle">You</text>
<text x="164" y="268" class="small" text-anchor="middle">/implement #16</text>
<text x="164" y="292" class="small" text-anchor="middle">and the seams</text>
<path d="M264 260 H316" class="arrow"/>

<!-- agent -->
<rect x="320" y="200" width="240" height="120" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="440" y="240" class="label" text-anchor="middle">Agent</text>
<text x="440" y="268" class="small" text-anchor="middle">decides on a tool call</text>
<text x="440" y="292" class="code" text-anchor="middle">pnpm db:reset</text>
<path d="M560 260 H612" class="arrow"/>

<!-- hook -->
<rect x="616" y="176" width="260" height="168" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="746" y="212" class="label" text-anchor="middle">PreToolUse hook</text>
<text x="746" y="240" class="small" text-anchor="middle">the harness pipes the call</text>
<text x="746" y="262" class="small" text-anchor="middle">as JSON on stdin to</text>
<text x="746" y="290" class="code" text-anchor="middle">scripts/agent-guard.mjs</text>
<text x="746" y="322" class="small" text-anchor="middle">a script, not a model</text>

<!-- exit 0 -->
<path d="M876 230 H960" class="arrow-green"/>
<text x="918" y="220" class="code" text-anchor="middle" fill="#429782">exit 0</text>
<rect x="958" y="176" width="190" height="100" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="1053" y="212" class="label" text-anchor="middle">Runs</text>
<text x="1053" y="240" class="small" text-anchor="middle">output goes back</text>
<text x="1053" y="262" class="small" text-anchor="middle">to the agent</text>

<!-- exit 2 -->
<path d="M876 300 H960" class="arrow-red"/>
<text x="918" y="290" class="code" text-anchor="middle" fill="#b4443c">exit 2</text>
<rect x="958" y="288" width="190" height="100" rx="12" fill="#fde8e6" stroke="#b4443c" stroke-width="2"/>
<text x="1053" y="324" class="label" text-anchor="middle">Blocked</text>
<text x="1053" y="352" class="small" text-anchor="middle">never runs; stderr</text>
<text x="1053" y="374" class="small" text-anchor="middle">goes back as the reason</text>

<!-- back to agent, then to you -->
<path d="M1050 388 V430 H440 V324" class="arrow-red"/>
<text x="745" y="452" class="small" text-anchor="middle">"Blocked: database reset. Tell the human what you wanted to run and why."</text>
<path d="M330 330 C 300 380, 220 380, 170 324" class="arrow"/>
<text x="250" y="408" class="small" text-anchor="middle">the agent asks you</text>

<!-- note -->
<rect x="64" y="500" width="1072" height="84" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/>
<text x="84" y="534" class="who" fill="#64748b">CI</text><text x="130" y="534" class="small">checks the result, after the push, minutes later, when the agent has already stopped.</text>
<text x="84" y="564" class="who" fill="#b4443c">HOOK</text><text x="150" y="564" class="small">checks the action, before it runs, inside the agent's turn. It can refuse. It cannot judge a diff.</text>
</svg>
