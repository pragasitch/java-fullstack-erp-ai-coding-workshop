<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Turn a mismatch into actionable feedback</title><desc id="desc">Renaming customer.name to customer.displayName in the shared contract produces type errors where the API still returns name and the UI still reads it. The agent updates both consumers and reruns checks.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="790" fill="white"/>
<rect x="24" y="24" width="1152" height="742" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Turn a mismatch into actionable feedback</text><text x="600" y="114" class="body" text-anchor="middle">Derived types connect contract changes to every consumer.</text>
<rect x="260" y="160" width="680" height="94" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="600.0" y="202.0" class="label" text-anchor="middle">Agent edits @erp/contracts</text><text x="600.0" y="231.0" class="body" text-anchor="middle">Example: rename customer.name → customer.displayName</text><path d="M600 254 V296 H324 V334" class="arrow"/><path d="M600 296 H876 V334" class="arrow"/><rect x="64" y="344" width="520" height="118" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="324.0" y="398.0" class="label" text-anchor="middle">API handler still returns name</text><text x="324.0" y="427.0" class="body" text-anchor="middle">Type error: response no longer matches</text><rect x="616" y="344" width="520" height="118" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="876.0" y="398.0" class="label" text-anchor="middle">UI still reads customer.name</text><text x="876.0" y="427.0" class="body" text-anchor="middle">Type error: property no longer exists</text><text x="600" y="510" class="body" text-anchor="middle">Illustrative errors: point to the mismatched code.</text><path d="M324 462 V548 H600 V584" class="arrow"/><path d="M876 462 V548 H600" class="arrow"/><rect x="260" y="594" width="680" height="94" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="600.0" y="636.0" class="label" text-anchor="middle">Agent fixes both uses, then checks again</text><text x="600.0" y="665.0" class="body" text-anchor="middle">The shared contract keeps the two sides aligned</text><text x="600" y="742" class="heading" text-anchor="middle">Precise feedback makes the next edit clear.</text>
</svg>
