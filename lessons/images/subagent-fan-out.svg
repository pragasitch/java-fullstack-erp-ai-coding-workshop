<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">One main window, several subagents at once</title><desc id="desc">A main context window on the left sends three briefs at the same time to three subagent windows on the right: a Standards reviewer, a Spec reviewer, and a third subagent standing for any other job. Each subagent works in its own window and sends back one short report. The main window ends up with the three reports and nothing else. A note says the subagents never see each other and that each one pays the fixed cost again.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#429782"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:17px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:15px;fill:#172033} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .arrow-green {fill:none;stroke:#429782;stroke-width:2.5;marker-end:url(#arrow-green)} .who {font-size:15px;font-weight:700;letter-spacing:1px}</style></defs>
<rect width="1200" height="720" fill="white"/>
<rect x="24" y="24" width="1152" height="672" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">One main window, several subagents at once</text>
<text x="600" y="114" class="body" text-anchor="middle">Three briefs go out together. Three short reports come back. The windows in between never meet.</text>

<!-- main window -->
<rect x="64" y="150" width="400" height="450" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="84" y="186" class="heading">Main window</text>
<text x="84" y="212" class="small">Wrote the code. Now waits for the reviews.</text>

<rect x="84" y="232" width="360" height="52" rx="8" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="100" y="255" class="label">Fixed cost</text><text x="100" y="276" class="small">Paid here, and again in every subagent.</text>

<rect x="84" y="296" width="360" height="92" rx="8" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="100" y="320" class="label">Conversation</text>
<text x="100" y="344" class="small">The ticket, the seams, the diff, the commit.</text>
<text x="100" y="366" class="small">Well over 100k tokens by now.</text>

<rect x="84" y="400" width="360" height="44" rx="8" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="100" y="428" class="label">## Standards, under 400 words</text>
<rect x="84" y="452" width="360" height="44" rx="8" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="100" y="480" class="label">## Spec, under 400 words</text>
<rect x="84" y="504" width="360" height="44" rx="8" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="100" y="532" class="label">Third report, a few sentences</text>

<text x="84" y="572" class="small">Three reports. Not one line of what they read.</text>

<!-- subagent 1: standards -->
<rect x="676" y="150" width="460" height="134" rx="12" fill="#ffffff" stroke="#c08a1d" stroke-width="2" stroke-dasharray="8 6"/>
<text x="696" y="182" class="heading">Standards reviewer</text>
<rect x="696" y="196" width="200" height="30" rx="6" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="706" y="217" class="small">brief: diff + standards</text>
<rect x="904" y="196" width="212" height="30" rx="6" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="914" y="217" class="small">work: read every rule</text>
<rect x="696" y="236" width="420" height="30" rx="6" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="706" y="257" class="small">report: where the diff breaks a documented standard</text>

<!-- subagent 2: spec -->
<rect x="676" y="308" width="460" height="134" rx="12" fill="#ffffff" stroke="#c08a1d" stroke-width="2" stroke-dasharray="8 6"/>
<text x="696" y="340" class="heading">Spec reviewer</text>
<rect x="696" y="354" width="200" height="30" rx="6" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="706" y="375" class="small">brief: diff + the spec</text>
<rect x="904" y="354" width="212" height="30" rx="6" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="914" y="375" class="small">work: read every line</text>
<rect x="696" y="394" width="420" height="30" rx="6" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="706" y="415" class="small">report: missing, extra, or done but wrong</text>

<!-- subagent 3: any other -->
<rect x="676" y="466" width="460" height="134" rx="12" fill="#ffffff" stroke="#c08a1d" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>
<text x="696" y="498" class="heading">Any other subagent</text>
<rect x="696" y="512" width="200" height="30" rx="6" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="706" y="533" class="small">brief: a question or ticket</text>
<rect x="904" y="512" width="212" height="30" rx="6" fill="#eef2f7" stroke="#b6c0cc" stroke-width="2"/>
<text x="914" y="533" class="small">work: explore or build</text>
<rect x="696" y="552" width="420" height="30" rx="6" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="706" y="573" class="small">report: same rule, brief in, short report out</text>

<!-- brief arrows: fan out from one point -->
<path d="M464 262 C 560 262, 580 211, 676 211" class="arrow"/>
<path d="M464 262 C 560 262, 580 369, 676 369" class="arrow"/>
<path d="M464 262 C 560 262, 580 527, 676 527" class="arrow"/>
<text x="570" y="248" class="small" text-anchor="middle">briefs, all at once</text>

<!-- report arrows: fan in -->
<path d="M676 251 C 600 251, 540 422, 464 422" class="arrow-green"/>
<path d="M676 409 C 600 409, 540 474, 464 474" class="arrow-green"/>
<path d="M676 567 C 600 567, 540 526, 464 526" class="arrow-green"/>
<text x="570" y="616" class="small" text-anchor="middle">reports, as each finishes</text>

<!-- notes -->
<text x="64" y="648" class="who" fill="#c08a1d">NEVER MEET</text><text x="190" y="648" class="small">Each subagent sees its brief and the repo. Not the main chat, not the other subagents.</text>
<text x="64" y="676" class="who" fill="#64748b">LIMIT</text><text x="130" y="676" class="small">Set by the tool: Claude Code runs up to 20 at once by default; Kiro and Codex run them in parallel too (section 5).</text>
</svg>
