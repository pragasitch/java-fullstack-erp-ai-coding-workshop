<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">Why small, complete slices help an agent</title><desc id="desc">Three benefits of vertical slices: connect database, contract, API and UI in phase one to expose integration mismatches early; run the app, test and click through after each phase; keep each change small so less context is needed and fixes or rollbacks stay manageable.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="1100" fill="white"/>
<rect x="24" y="24" width="1152" height="1052" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Why small, complete slices help an agent</text><text x="600" y="114" class="body" text-anchor="middle">Each phase creates a concrete result and a clear next step.</text>
<rect x="64" y="150" width="1072" height="250" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="192" class="heading" text-anchor="start">1 · Find integration problems in the first slice</text><text x="88" y="228" class="body" text-anchor="start">Phase 1 connects real layers, so mismatches become visible immediately.</text><rect x="88" y="252" width="210" height="56" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="193.0" y="287.0" class="label" text-anchor="middle">Database</text><path d="M298 280 H320" class="arrow"/><rect x="330" y="252" width="210" height="56" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="435.0" y="287.0" class="label" text-anchor="middle">Contract</text><path d="M540 280 H562" class="arrow"/><rect x="572" y="252" width="210" height="56" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="677.0" y="287.0" class="label" text-anchor="middle">API</text><path d="M782 280 H804" class="arrow"/><rect x="814" y="252" width="210" height="56" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="919.0" y="287.0" class="label" text-anchor="middle">UI</text><path d="M677 308 V334" class="arrow"/><rect x="492" y="344" width="370" height="38" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="677.0" y="370.0" class="label" text-anchor="middle">Mismatch → fix it now</text><rect x="64" y="426" width="1072" height="256" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="468" class="heading" text-anchor="start">2 · Verify working software after every phase</text><rect x="88" y="500" width="292" height="58" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="234.0" y="536.0" class="label" text-anchor="middle">Phase 1 · List</text><path d="M234 558 V578" class="arrow"/><rect x="88" y="588" width="292" height="66" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="234.0" y="628.0" class="label" text-anchor="middle">Run · test · click through</text><path d="M380 621 H442" class="arrow"/><rect x="454" y="500" width="292" height="58" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="600.0" y="536.0" class="label" text-anchor="middle">Phase 2 · Add</text><path d="M600 558 V578" class="arrow"/><rect x="454" y="588" width="292" height="66" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="600.0" y="628.0" class="label" text-anchor="middle">Run · test · click through</text><path d="M746 621 H808" class="arrow"/><rect x="820" y="500" width="292" height="58" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="966.0" y="536.0" class="label" text-anchor="middle">Phase 3 · Edit</text><path d="M966 558 V578" class="arrow"/><rect x="820" y="588" width="292" height="66" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="966.0" y="628.0" class="label" text-anchor="middle">Run · test · click through</text><rect x="64" y="708" width="1072" height="304" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="750" class="heading" text-anchor="start">3 · Keep each change small enough to reason about</text><rect x="88" y="782" width="310" height="190" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="243" y="817" class="label" text-anchor="middle">One thin slice</text><rect x="120" y="838" width="220" height="14" rx="4" fill="#429782"/><rect x="120" y="865" width="170" height="14" rx="4" fill="#429782"/><rect x="120" y="892" width="195" height="14" rx="4" fill="#429782"/><rect x="120" y="919" width="130" height="14" rx="4" fill="#429782"/><path d="M398 877 H464" class="arrow"/><rect x="474" y="794" width="638" height="70" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="793.0" y="824.0" class="label" text-anchor="middle">Less context to hold</text><text x="793.0" y="853.0" class="body" text-anchor="middle">Only the code needed for this increment</text><rect x="474" y="890" width="638" height="70" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="793.0" y="920.0" class="label" text-anchor="middle">Smaller correction or rollback</text><text x="793.0" y="949.0" class="body" text-anchor="middle">Fix or undo the slice, then try again</text><text x="600" y="1060" class="heading" text-anchor="middle">Earlier feedback · visible progress · cheaper mistakes</text>
</svg>
