<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc">
<title id="title">Why Turborepo for this workshop?</title><desc id="desc">pnpm links packages and runs scripts without a task-output cache. Turborepo adds task ordering, parallel execution, caching and filtering with a small configuration. Nx adds a broader plugin, generation and boundary-rule toolkit. Turborepo retains familiar package scripts.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="970" fill="white"/>
<rect x="24" y="24" width="1152" height="922" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Why Turborepo for this workshop?</text><text x="600" y="114" class="body" text-anchor="middle">Enough orchestration to help, with little extra configuration.</text>
<rect x="64" y="158" width="340" height="452" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><rect x="80" y="174" width="308" height="90" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="234.0" y="214.0" class="label" text-anchor="middle">pnpm workspaces</text><text x="234.0" y="243.0" class="body" text-anchor="middle">Package management</text><rect x="430" y="158" width="340" height="452" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><rect x="446" y="174" width="308" height="90" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="600.0" y="214.0" class="label" text-anchor="middle">Turborepo</text><text x="600.0" y="243.0" class="body" text-anchor="middle">Our workshop choice</text><rect x="796" y="158" width="340" height="452" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><rect x="812" y="174" width="308" height="90" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="966.0" y="214.0" class="label" text-anchor="middle">Nx</text><text x="966.0" y="243.0" class="body" text-anchor="middle">A broader toolkit</text><text x="88" y="311" class="body" text-anchor="start">Links local packages</text><text x="88" y="349" class="body" text-anchor="start">Runs package scripts</text><text x="88" y="387" class="body" text-anchor="start">Recursive and filtered runs</text><text x="88" y="454" class="label" text-anchor="start">Trade-off</text><text x="88" y="490" class="body" text-anchor="start">No task-output cache</text><text x="88" y="519" class="body" text-anchor="start">built into pnpm.</text><text x="454" y="311" class="body" text-anchor="start">Orders tasks + parallel runs</text><text x="454" y="349" class="body" text-anchor="start">Local and remote caching</text><text x="454" y="387" class="body" text-anchor="start">Filters relevant packages</text><text x="454" y="454" class="label" text-anchor="start">Trade-off</text><text x="454" y="490" class="body" text-anchor="start">Small turbo.json layer;</text><text x="454" y="519" class="body" text-anchor="start">no generator plugins or</text><text x="454" y="548" class="body" text-anchor="start">boundary rules built in.</text><text x="820" y="311" class="body" text-anchor="start">Task graph + caching</text><text x="820" y="349" class="body" text-anchor="start">Plugins + code generators</text><text x="820" y="387" class="body" text-anchor="start">Module-boundary rules</text><text x="820" y="454" class="label" text-anchor="start">Trade-off</text><text x="820" y="490" class="body" text-anchor="start">More concepts and choices</text><text x="820" y="519" class="body" text-anchor="start">than this workshop needs.</text><rect x="64" y="644" width="1072" height="236" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="600" y="686" class="heading" text-anchor="middle">Why the thin layer fits this workshop</text><rect x="90" y="716" width="1020" height="58" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="600.0" y="752.0" class="label" text-anchor="middle">Turborepo coordinates the existing package scripts</text><path d="M252 774 V800" class="arrow"/><rect x="90" y="810" width="324" height="46" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="252.0" y="840.0" class="label" text-anchor="middle">web → vite build</text><path d="M600 774 V800" class="arrow"/><rect x="438" y="810" width="324" height="46" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="600.0" y="840.0" class="label" text-anchor="middle">api → nest build</text><path d="M948 774 V800" class="arrow"/><rect x="786" y="810" width="324" height="46" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="948.0" y="840.0" class="label" text-anchor="middle">database → tsup</text><text x="600" y="925" class="body" text-anchor="middle">Keep familiar tools. Add shared scheduling and caching.</text>
</svg>
