<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
<title id="title">Do the work once. Reuse the result.</title><desc id="desc">A task hash selects a cache entry. On a miss the task executes and stores outputs and logs; on a hit outputs and logs are restored. Editing only web rebuilds web while other builds are cached. Database generation is uncached.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="810" fill="white"/>
<rect x="24" y="24" width="1152" height="762" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Do the work once. Reuse the result.</text><text x="600" y="114" class="body" text-anchor="middle">Caching applies to each task, based on its inputs.</text>
<rect x="64" y="160" width="300" height="94" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="214.0" y="202.0" class="label" text-anchor="middle">Task inputs</text><text x="214.0" y="231.0" class="body" text-anchor="middle">files · dependencies · config</text><path d="M364 207 H420" class="arrow"/><rect x="430" y="160" width="260" height="94" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="560.0" y="202.0" class="label" text-anchor="middle">Compute task hash</text><text x="560.0" y="231.0" class="body" text-anchor="middle">relevant environment</text><path d="M690 207 H756" class="arrow"/><rect x="766" y="160" width="370" height="94" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="951.0" y="202.0" class="label" text-anchor="middle">Matching cache entry?</text><text x="951.0" y="231.0" class="body" text-anchor="middle">look up the task hash</text><path d="M860 254 V300 H330 V338" class="arrow"/><path d="M1040 254 V300 H870 V338" class="arrow"/><text x="390" y="326" class="heading" text-anchor="middle">MISS</text><text x="930" y="326" class="heading" text-anchor="middle">HIT</text><rect x="80" y="350" width="500" height="112" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="330.0" y="401.0" class="label" text-anchor="middle">Run the task</text><text x="330.0" y="430.0" class="body" text-anchor="middle">save outputs and logs</text><rect x="620" y="350" width="500" height="112" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="870.0" y="401.0" class="label" text-anchor="middle">Restore outputs + replay logs</text><text x="870.0" y="430.0" class="body" text-anchor="middle">skip executing the task</text><rect x="64" y="500" width="1072" height="270" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="540" class="heading" text-anchor="start">Example: edit only apps/web, then build again</text><rect x="88" y="568" width="232" height="82" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="204.0" y="604.0" class="label" text-anchor="middle">contracts</text><text x="204.0" y="633.0" class="body" text-anchor="middle">restore</text><rect x="352" y="568" width="232" height="82" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="468.0" y="604.0" class="label" text-anchor="middle">database</text><text x="468.0" y="633.0" class="body" text-anchor="middle">restore build</text><rect x="616" y="568" width="232" height="82" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="732.0" y="604.0" class="label" text-anchor="middle">api</text><text x="732.0" y="633.0" class="body" text-anchor="middle">restore</text><rect x="880" y="568" width="232" height="82" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="996.0" y="604.0" class="label" text-anchor="middle">web</text><text x="996.0" y="633.0" class="body" text-anchor="middle">rebuild</text><text x="88" y="697" class="body" text-anchor="start">Unchanged build inputs reuse cached output; changed inputs need fresh work.</text><text x="88" y="735" class="body" text-anchor="start">Exception in this repo: db:generate always runs because cache is false.</text>
</svg>
