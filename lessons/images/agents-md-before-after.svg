<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">What moved where</title><desc id="desc">Before: three AGENTS.md files of 52, 24 and 26 lines, about 1,800 tokens, all always loaded. After: the same three files at 34, 10 and 9 lines, about 1,000 tokens always loaded, plus three skills of about 2,900 tokens loaded on demand. The sorting rule: needed every session goes to AGENTS.md, needed for one kind of task becomes a skill, derivable from code or tooling is deleted.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:18px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:19px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="820" fill="white"/>
<rect x="24" y="24" width="1152" height="772" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">What moved where</text><text x="600" y="114" class="body" text-anchor="middle">Same knowledge, smaller fixed cost.</text>
<text x="80" y="170" class="heading">Before</text><text x="1120" y="170" class="small" text-anchor="end">everything always loaded · ≈1,800 tokens</text>
<rect x="80" y="186" width="420" height="104" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/><text x="290" y="226" class="label" text-anchor="middle">AGENTS.md · 52 lines</text><text x="290" y="256" class="small" text-anchor="middle">rules + 6-step workflow + gotchas + formatting</text>
<rect x="520" y="186" width="290" height="104" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/><text x="665" y="226" class="label" text-anchor="middle">apps/api · 24 lines</text><text x="665" y="256" class="small" text-anchor="middle">rules + test recipe</text>
<rect x="830" y="186" width="290" height="104" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/><text x="975" y="226" class="label" text-anchor="middle">apps/web · 26 lines</text><text x="975" y="256" class="small" text-anchor="middle">rules + shadcn + test recipe</text>
<path d="M600 290 V338" class="arrow"/>
<text x="80" y="376" class="heading">After</text><text x="1120" y="376" class="small" text-anchor="end">always loaded · ≈1,000 tokens</text>
<rect x="80" y="392" width="420" height="80" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="290" y="426" class="label" text-anchor="middle">AGENTS.md · 34 lines</text><text x="290" y="454" class="small" text-anchor="middle">layout · 5 rules · skill list</text>
<rect x="520" y="392" width="290" height="80" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="665" y="426" class="label" text-anchor="middle">apps/api · 10 lines</text><text x="665" y="454" class="small" text-anchor="middle">6 rules</text>
<rect x="830" y="392" width="290" height="80" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="975" y="426" class="label" text-anchor="middle">apps/web · 9 lines</text><text x="975" y="454" class="small" text-anchor="middle">5 rules</text>
<text x="80" y="520" class="label">Skills</text><text x="1120" y="520" class="small" text-anchor="end">loaded on demand · ≈2,900 tokens in total</text>
<rect x="80" y="536" width="340" height="80" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="250" y="570" class="code" text-anchor="middle">add-feature</text><text x="250" y="598" class="small" text-anchor="middle">workflow, templates, Prisma notes</text>
<rect x="430" y="536" width="340" height="80" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="600" y="570" class="code" text-anchor="middle">write-tests</text><text x="600" y="598" class="small" text-anchor="middle">api spec, web test, schema test</text>
<rect x="780" y="536" width="340" height="80" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="950" y="570" class="code" text-anchor="middle">repo-commands</text><text x="950" y="598" class="small" text-anchor="middle">Docker, db scripts, gotchas</text>
<rect x="64" y="652" width="346" height="118" rx="12" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="237" y="690" class="label" text-anchor="middle">Needed every session</text><text x="237" y="720" class="body" text-anchor="middle">a mistake without it</text><text x="237" y="748" class="code" text-anchor="middle">→ AGENTS.md</text>
<rect x="427" y="652" width="346" height="118" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="600" y="690" class="label" text-anchor="middle">Needed for one kind of task</text><text x="600" y="720" class="body" text-anchor="middle">a recipe, a template, a cheat-sheet</text><text x="600" y="748" class="code" text-anchor="middle">→ skill</text>
<rect x="790" y="652" width="346" height="118" rx="12" fill="#ffffff" stroke="#c08a1d" stroke-width="2"/><text x="963" y="690" class="label" text-anchor="middle">Derivable from code or tooling</text><text x="963" y="720" class="body" text-anchor="middle">formatter config, stack lists, duplicates</text><text x="963" y="748" class="code" text-anchor="middle">→ delete</text>
</svg>
