<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">What a good ticket looks like</title><desc id="desc">Two issue cards side by side. Left, marked "Not a ticket": "Products: Prisma model and migration". A layer strip above it shows only the schema layer filled. Its criteria, "Migration runs" and "Products page loads", are flagged as passing today. It has no Covers line and no TOR IDs. Right, marked "A ticket": "#15 Create and edit a product, with SKU uniqueness enforced", parent #12, Covers MD-01 and MD-02, labelled ready-for-agent. Its layer strip has schema, contract, API, UI and tests all filled. It describes what a buyer can do end to end, has criteria that fail against today's code and cite TOR IDs, and is blocked by #14 Stores and suppliers. Below, three checks: vertical, traceable, and each criterion can fail today.</desc>
<defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .label {font-size:21px;font-weight:600} .sub {font-size:18px;font-weight:700} .body {font-size:20px;fill:#475569} .small {font-size:18px;fill:#475569} .cell {font-size:15px;font-weight:600;fill:#172033} .cell-off {font-size:15px;font-weight:600;fill:#94a3b8} .code {font-family:Menlo,Consolas,monospace;font-size:15px;fill:#475569} .pill {font-size:14px;font-weight:700;fill:#8a5a00} .badge {font-size:14px;font-weight:700;fill:#ffffff}</style></defs>
<rect width="1200" height="820" fill="white"/>
<rect x="24" y="24" width="1152" height="772" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">What a good ticket looks like</text>
<text x="600" y="114" class="body" text-anchor="middle">Same work, written down two ways. Only one can be handed to an agent.</text>

<!-- Left card: not a ticket -->
<rect x="60" y="150" width="520" height="520" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<text x="80" y="186" class="label">Not a ticket: one layer</text>
<rect x="80" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#c08a1d" stroke-width="2"/><text x="126" y="225" class="cell" text-anchor="middle">Schema</text>
<rect x="177" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="223" y="225" class="cell-off" text-anchor="middle">Contract</text>
<rect x="274" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="320" y="225" class="cell-off" text-anchor="middle">API</text>
<rect x="371" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="417" y="225" class="cell-off" text-anchor="middle">UI</text>
<rect x="468" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="514" y="225" class="cell-off" text-anchor="middle">Tests</text>

<rect x="80" y="250" width="480" height="400" rx="10" fill="#ffffff" stroke="#c08a1d" stroke-width="2"/>
<text x="96" y="284" class="label">Products: Prisma model and migration</text>
<text x="96" y="322" class="sub">What to build</text>
<text x="96" y="348" class="small">Add a Product model with sku, name, unit,</text>
<text x="96" y="372" class="small">price, active flag and thresholds. Write</text>
<text x="96" y="396" class="small">the migration and regenerate the client.</text>
<text x="96" y="436" class="sub">Acceptance criteria</text>
<text x="96" y="462" class="small">[ ] Migration runs</text>
<rect x="420" y="444" width="124" height="24" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="1.5"/><text x="482" y="461" class="pill" text-anchor="middle">passes today</text>
<text x="96" y="486" class="small">[ ] Products page loads</text>
<rect x="420" y="468" width="124" height="24" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="1.5"/><text x="482" y="485" class="pill" text-anchor="middle">passes today</text>
<text x="96" y="526" class="sub">Blocked by</text>
<text x="96" y="552" class="small">None</text>
<rect x="90" y="596" width="214" height="26" rx="13" fill="#fff4d6" stroke="#c08a1d" stroke-width="1.5"/><text x="197" y="614" class="pill" text-anchor="middle">one layer, nothing to demo</text>
<rect x="312" y="596" width="128" height="26" rx="13" fill="#fff4d6" stroke="#c08a1d" stroke-width="1.5"/><text x="376" y="614" class="pill" text-anchor="middle">no Covers: line</text>
<rect x="448" y="596" width="96" height="26" rx="13" fill="#fff4d6" stroke="#c08a1d" stroke-width="1.5"/><text x="496" y="614" class="pill" text-anchor="middle">no TOR IDs</text>

<!-- Right card: a ticket -->
<rect x="620" y="150" width="520" height="520" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<text x="640" y="186" class="label">A ticket: a tracer bullet</text>
<rect x="640" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="686" y="225" class="cell" text-anchor="middle">Schema</text>
<rect x="737" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="783" y="225" class="cell" text-anchor="middle">Contract</text>
<rect x="834" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="880" y="225" class="cell" text-anchor="middle">API</text>
<rect x="931" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="977" y="225" class="cell" text-anchor="middle">UI</text>
<rect x="1028" y="204" width="92" height="30" rx="6" fill="#ffffff" stroke="#429782" stroke-width="2"/><text x="1074" y="225" class="cell" text-anchor="middle">Tests</text>

<rect x="640" y="250" width="480" height="400" rx="10" fill="#ffffff" stroke="#429782" stroke-width="2"/>
<text x="656" y="284" class="label">#15 Create and edit a product,</text>
<text x="656" y="308" class="label">with SKU uniqueness enforced</text>
<text x="656" y="338" class="code">Parent: #12   Covers: MD-01, MD-02</text>
<rect x="976" y="320" width="128" height="24" rx="12" fill="#429782"/><text x="1040" y="337" class="badge" text-anchor="middle">ready-for-agent</text>
<text x="656" y="372" class="sub">What to build</text>
<text x="656" y="398" class="small">A buyer creates a product with SKU, name,</text>
<text x="656" y="422" class="small">unit, price and per-store thresholds, edits</text>
<text x="656" y="446" class="small">it and sees it in the list. A second</text>
<text x="656" y="470" class="small">product with the same SKU is refused.</text>
<text x="656" y="506" class="sub">Acceptance criteria</text>
<text x="656" y="532" class="small">[ ] Second product with SKU001 is rejected,</text>
<text x="684" y="556" class="small">the message names the SKU (MD-01)</text>
<text x="656" y="580" class="small">[ ] staff_b01 calling the create API is</text>
<text x="684" y="604" class="small">refused and nothing is saved (NFR-01)</text>
<text x="656" y="638" class="sub">Blocked by</text>
<text x="770" y="638" class="small">#14 Stores and suppliers</text>

<!-- Three checks -->
<rect x="64" y="694" width="346" height="96" rx="12" fill="#ffffff" stroke="#429782" stroke-width="2"/>
<text x="237" y="728" class="label" text-anchor="middle">Vertical</text>
<text x="237" y="756" class="small" text-anchor="middle">Schema to UI to tests, demoable alone.</text>
<text x="237" y="780" class="small" text-anchor="middle">One layer wide? Ask to merge.</text>
<rect x="427" y="694" width="346" height="96" rx="12" fill="#ffffff" stroke="#429782" stroke-width="2"/>
<text x="600" y="728" class="label" text-anchor="middle">Traceable</text>
<text x="600" y="756" class="small" text-anchor="middle">A Covers: line with TOR IDs. Criteria</text>
<text x="600" y="780" class="small" text-anchor="middle">cite AC-xx scenarios where one exists.</text>
<rect x="790" y="694" width="346" height="96" rx="12" fill="#ffffff" stroke="#429782" stroke-width="2"/>
<text x="963" y="728" class="label" text-anchor="middle">Each criterion can fail today</text>
<text x="963" y="756" class="small" text-anchor="middle">"The page loads" passes now.</text>
<text x="963" y="780" class="small" text-anchor="middle">A refused duplicate SKU does not.</text>
</svg>
