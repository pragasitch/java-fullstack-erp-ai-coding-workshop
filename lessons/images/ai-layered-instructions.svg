<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Shared rules, then stack-specific guidance</title><desc id="desc">Root AGENTS.md supplies shared workflow and conventions. API and web AGENTS.md files add stack-specific guidance. An agent changing both apps uses the root rules and both app rule sets.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="840" fill="white"/>
<rect x="24" y="24" width="1152" height="792" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Shared rules, then stack-specific guidance</text><text x="600" y="114" class="body" text-anchor="middle">Instruction files keep relevant conventions close to the code.</text>
<rect x="220" y="160" width="760" height="114" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="600.0" y="212.0" class="label" text-anchor="middle">Root AGENTS.md</text><text x="600.0" y="241.0" class="body" text-anchor="middle">Layout · contract-first · ESM · pnpm check · skills</text><path d="M600 274 V322 H324 V360" class="arrow"/><path d="M600 322 H876 V360" class="arrow"/><rect x="64" y="370" width="520" height="106" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="324.0" y="418.0" class="label" text-anchor="middle">apps/api/AGENTS.md</text><text x="324.0" y="447.0" class="body" text-anchor="middle">NestJS · @Implement · PrismaService · no DTOs</text><rect x="616" y="370" width="520" height="106" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="876.0" y="418.0" class="label" text-anchor="middle">apps/web/AGENTS.md</text><text x="876.0" y="447.0" class="body" text-anchor="middle">React · typed client · @/ alias · Tailwind</text><path d="M324 476 V524" class="arrow"/><path d="M876 476 V524" class="arrow"/><rect x="64" y="534" width="520" height="92" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="324.0" y="575.0" class="label" text-anchor="middle">Editing the API</text><text x="324.0" y="604.0" class="body" text-anchor="middle">shared rules + API rules</text><rect x="616" y="534" width="520" height="92" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="876.0" y="575.0" class="label" text-anchor="middle">Editing the web app</text><text x="876.0" y="604.0" class="body" text-anchor="middle">shared rules + web rules</text><rect x="64" y="670" width="1072" height="130" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="600" y="714" class="heading" text-anchor="middle">One vertical slice may need both sets of instructions.</text><text x="600" y="755" class="body" text-anchor="middle">Read the repository rules, then the rules for each app being changed.</text>
</svg>
