<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="846" viewBox="0 0 1200 846" role="img" aria-labelledby="title desc">
<title id="title">Run a subset without skipping prerequisites</title><desc id="desc">Filtering test to @erp/api selects API tests. Task rules include contracts build and database generation followed by database build. Web, contracts and database tests are not selected.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="846" fill="white"/>
<rect x="24" y="24" width="1152" height="798" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Run a subset without skipping prerequisites</text><text x="600" y="114" class="body" text-anchor="middle">A focused test run still prepares the shared packages it needs.</text>
<rect x="64" y="156" width="1072" height="70" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="600.0" y="198.0" class="label" text-anchor="middle">pnpm turbo run test --filter=@erp/api</text><text x="80" y="280" class="heading" text-anchor="start">Prerequisites included by dependsOn</text><text x="850" y="280" class="heading" text-anchor="start">Selected task</text><rect x="80" y="320" width="245" height="84" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="202.5" y="357.0" class="label" text-anchor="middle">database</text><text x="202.5" y="386.0" class="body" text-anchor="middle">db:generate</text><rect x="420" y="320" width="245" height="84" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="542.5" y="357.0" class="label" text-anchor="middle">database</text><text x="542.5" y="386.0" class="body" text-anchor="middle">build</text><rect x="420" y="460" width="245" height="84" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="542.5" y="497.0" class="label" text-anchor="middle">contracts</text><text x="542.5" y="526.0" class="body" text-anchor="middle">build</text><rect x="850" y="390" width="270" height="84" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="985.0" y="427.0" class="label" text-anchor="middle">api</text><text x="985.0" y="456.0" class="body" text-anchor="middle">test</text><path d="M325 362 H410" class="arrow"/><path d="M665 362 H755 V418 H840" class="arrow"/><path d="M665 502 H755 V446 H840" class="arrow"/><rect x="64" y="594" width="1072" height="164" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="634" class="heading" text-anchor="start">Outside this run</text><rect x="88" y="660" width="230" height="62" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="203.0" y="698.0" class="label" text-anchor="middle">web: test</text><rect x="338" y="660" width="230" height="62" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="453.0" y="698.0" class="label" text-anchor="middle">contracts: test</text><rect x="588" y="660" width="230" height="62" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="703.0" y="698.0" class="label" text-anchor="middle">database: test</text><text x="846" y="700" class="body" text-anchor="start">Not selected</text><text x="600" y="802" class="body" text-anchor="middle">The filter selects API tests; task rules pull in dependency builds.</text>
