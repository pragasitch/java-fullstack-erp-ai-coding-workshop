<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">A short feedback loop for every slice</title><desc id="desc">The agent edits a slice and runs pnpm check for lint, typecheck, test and build. Turborepo rebuilds changed dependencies before consumer checks and restores cached results for unchanged task inputs. Errors guide the next edit.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="860" fill="white"/>
<rect x="24" y="24" width="1152" height="812" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">A short feedback loop for every slice</text><text x="600" y="114" class="body" text-anchor="middle">Edit → verify → read the result → fix → repeat</text>
<rect x="64" y="170" width="290" height="88" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="209.0" y="209.0" class="label" text-anchor="middle">Edit a thin slice</text><text x="209.0" y="238.0" class="body" text-anchor="middle">source changes</text><path d="M354 214 H426" class="arrow"/><rect x="436" y="170" width="328" height="88" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="600.0" y="209.0" class="label" text-anchor="middle">pnpm check</text><text x="600.0" y="238.0" class="body" text-anchor="middle">one verification command</text><path d="M764 214 H836" class="arrow"/><rect x="846" y="170" width="290" height="88" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="991.0" y="209.0" class="label" text-anchor="middle">Read the results</text><text x="991.0" y="238.0" class="body" text-anchor="middle">fix or continue</text><path d="M991 258 V306 H209 V268" class="arrow"/><text x="600" y="340" class="body" text-anchor="middle">Fix reported errors and repeat.</text><rect x="64" y="382" width="1072" height="176" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="424" class="heading" text-anchor="start">Checks across the workspace</text><rect x="88" y="454" width="232" height="64" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="204.0" y="493.0" class="label" text-anchor="middle">Lint</text><rect x="352" y="454" width="232" height="64" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="468.0" y="493.0" class="label" text-anchor="middle">Typecheck</text><rect x="616" y="454" width="232" height="64" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="732.0" y="493.0" class="label" text-anchor="middle">Test</text><rect x="880" y="454" width="232" height="64" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="996.0" y="493.0" class="label" text-anchor="middle">Build</text><rect x="64" y="590" width="1072" height="228" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="634" class="heading" text-anchor="start">Correct dependencies, less repeated work</text><rect x="88" y="662" width="300" height="80" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="238.0" y="697.0" class="label" text-anchor="middle">Shared source changed</text><text x="238.0" y="726.0" class="body" text-anchor="middle">rebuild dependency</text><path d="M388 702 H438" class="arrow"/><rect x="448" y="662" width="300" height="80" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="598.0" y="697.0" class="label" text-anchor="middle">Check the consumer</text><text x="598.0" y="726.0" class="body" text-anchor="middle">use fresh built output</text><rect x="778" y="662" width="334" height="80" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="945.0" y="697.0" class="label" text-anchor="middle">Unchanged task inputs</text><text x="945.0" y="726.0" class="body" text-anchor="middle">reuse cached results</text><text x="88" y="785" class="body" text-anchor="start">Cache hits skip work; uncached tasks such as db:generate still run.</text>
</svg>
