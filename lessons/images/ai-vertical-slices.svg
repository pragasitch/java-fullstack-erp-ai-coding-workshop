<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Build a working slice in every phase</title><desc id="desc">Horizontal phases build database, API and UI separately before integration. Vertical slices deliver listing, creating and editing customers as separate working increments, each crossing database, contract, API and UI and ending in verification.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .heading {font-size:24px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:20px} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="980" fill="white"/>
<rect x="24" y="24" width="1152" height="932" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">Build a working slice in every phase</text><text x="600" y="114" class="body" text-anchor="middle">Example feature: customer management</text>
<rect x="64" y="156" width="1072" height="244" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="198" class="heading" text-anchor="start">Horizontal phases: integrate after separate layers are built</text><rect x="88" y="230" width="240" height="86" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="208.0" y="268.0" class="label" text-anchor="middle">1 · Database</text><text x="208.0" y="297.0" class="body" text-anchor="middle">all tables</text><path d="M328 273 H346" class="arrow"/><rect x="356" y="230" width="240" height="86" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="476.0" y="268.0" class="label" text-anchor="middle">2 · API</text><text x="476.0" y="297.0" class="body" text-anchor="middle">all routes</text><path d="M596 273 H614" class="arrow"/><rect x="624" y="230" width="240" height="86" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="744.0" y="268.0" class="label" text-anchor="middle">3 · UI</text><text x="744.0" y="297.0" class="body" text-anchor="middle">all screens</text><path d="M864 273 H906" class="arrow"/><rect x="916" y="230" width="196" height="86" rx="12" fill="#ffedd0" stroke="#bf9458" stroke-width="2"/><text x="1014.0" y="268.0" class="label" text-anchor="middle">Integrate</text><text x="1014.0" y="297.0" class="body" text-anchor="middle">first full run</text><text x="88" y="365" class="body" text-anchor="start">Assumptions between layers can survive until the end.</text><rect x="64" y="430" width="1072" height="454" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/><text x="88" y="474" class="heading" text-anchor="start">Vertical slices: integrate and verify in every phase</text><text x="234" y="520" class="label" text-anchor="middle">1 · List customers</text><text x="234" y="550" class="body" text-anchor="middle">read-only flow</text><rect x="88" y="578" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="234.0" y="605.0" class="label" text-anchor="middle">Database</text><path d="M234 618 V627" class="arrow"/><rect x="88" y="631" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="234.0" y="658.0" class="label" text-anchor="middle">Contract</text><path d="M234 671 V680" class="arrow"/><rect x="88" y="684" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="234.0" y="711.0" class="label" text-anchor="middle">API</text><path d="M234 724 V733" class="arrow"/><rect x="88" y="737" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="234.0" y="764.0" class="label" text-anchor="middle">UI</text><text x="234" y="829" class="label" text-anchor="middle">Run + verify</text><path d="M380 680 H442" class="arrow"/><text x="600" y="520" class="label" text-anchor="middle">2 · Add a customer</text><text x="600" y="550" class="body" text-anchor="middle">create flow</text><rect x="454" y="578" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="600.0" y="605.0" class="label" text-anchor="middle">Database</text><path d="M600 618 V627" class="arrow"/><rect x="454" y="631" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="600.0" y="658.0" class="label" text-anchor="middle">Contract</text><path d="M600 671 V680" class="arrow"/><rect x="454" y="684" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="600.0" y="711.0" class="label" text-anchor="middle">API</text><path d="M600 724 V733" class="arrow"/><rect x="454" y="737" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="600.0" y="764.0" class="label" text-anchor="middle">UI</text><text x="600" y="829" class="label" text-anchor="middle">Run + verify</text><path d="M746 680 H808" class="arrow"/><text x="966" y="520" class="label" text-anchor="middle">3 · Edit a customer</text><text x="966" y="550" class="body" text-anchor="middle">update flow</text><rect x="820" y="578" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="966.0" y="605.0" class="label" text-anchor="middle">Database</text><path d="M966 618 V627" class="arrow"/><rect x="820" y="631" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="966.0" y="658.0" class="label" text-anchor="middle">Contract</text><path d="M966 671 V680" class="arrow"/><rect x="820" y="684" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="966.0" y="711.0" class="label" text-anchor="middle">API</text><path d="M966 724 V733" class="arrow"/><rect x="820" y="737" width="292" height="40" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/><text x="966.0" y="764.0" class="label" text-anchor="middle">UI</text><text x="966" y="829" class="label" text-anchor="middle">Run + verify</text><text x="600" y="932" class="heading" text-anchor="middle">Each slice: one branch · one diff · one pnpm check</text>
</svg>
