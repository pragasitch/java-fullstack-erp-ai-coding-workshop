name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Web, contracts and the shared packages.
      - run: pnpm turbo run lint typecheck test build

      # The Spring Boot API: compile, unit tests, package.
      - name: Build and test the Java API
        run: mvn -q -B -f apps/api/pom.xml verify

  # The Demo: lines, run by a machine. Playwright drives the built web app against the
  # Spring Boot API and a real Postgres, on every pull request. Unlike the AI review this
  # job is a check: red blocks the merge. See lessons/10 and apps/e2e.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    # Spring reads these; Flyway migrates and the seeder creates the demo users when
    # Playwright starts the API, so there is no separate migrate/seed step.
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/erp
      SPRING_DATASOURCE_USERNAME: erp
      SPRING_DATASOURCE_PASSWORD: erp
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: pnpm install --frozen-lockfile

      # The browser download is ~100 MB; cache it by Playwright version.
      - name: Read the Playwright version
        id: playwright
        working-directory: apps/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # --with-deps installs the system libraries Chromium needs. The guard refuses this
      # flag to agents; the job is not an agent, and the runner is thrown away afterwards.
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @erp/e2e exec playwright install chromium --with-deps

      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @erp/e2e exec playwright install-deps chromium

      # Builds the web app and the API, then Playwright starts both (the API migrates and
      # seeds on boot) and runs apps/e2e/tests.
      - run: pnpm e2e

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
